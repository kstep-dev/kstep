name: Build Linux kernel
description: Restore from cache, or download/build/save the Linux kernel.

inputs:
  version:
    description: Linux version (e.g., v6.18)
    required: true
  cov:
    description: Enable scheduler coverage instrumentation (merges linux/config.kstep.cov)
    default: "false"

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v5
      with:
        path: |
          build/${{ inputs.version }}/kernel
          build/${{ inputs.version }}/vmlinux
          build/${{ inputs.version }}/linux
        key: ${{ runner.arch }}-${{ inputs.version }}${{ inputs.cov == 'true' && '-cov' || '' }}-${{ hashFiles('linux/config.kstep*', 'linux/cov.c', 'linux/*.kstep') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # `clean --all` drops the kbuild objects before caching; the image and Module.symvers survive it
      run: |
        ./checkout.py ${{ inputs.version }} --tar
        ./make.py --build ${{ inputs.version }} linux ${{ inputs.cov == 'true' && '--config linux/config.kstep.cov' || '' }}
        ./make.py --build ${{ inputs.version }} clean --all
