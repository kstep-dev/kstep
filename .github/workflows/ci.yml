name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Every week

env:
  PACKAGES_X86_64: qemu-system-x86 libelf-dev musl-tools
  PACKAGES_AARCH64: qemu-system-arm libelf-dev musl-tools

jobs:
  deps:
    name: Cache deps (${{ matrix.arm && 'aarch64' || 'x86_64' }})
    strategy:
      matrix:
        arm: [false, true]
    runs-on: ${{ matrix.arm && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache deps
        uses: ./.github/actions/apt-deps
        with:
          packages: ${{ matrix.arm && env.PACKAGES_AARCH64 || env.PACKAGES_X86_64 }}

  test:
    needs: deps
    name: ${{ matrix.fuzz && 'Fuzz' || 'Run' }} ${{ matrix.version }} (${{ matrix.arm && 'aarch64' || 'x86_64' }})
    strategy:
      matrix:
        include:
          - version: v7.0  # latest
          - version: v7.0
            arm: true
          - version: v6.18 # 2025 LTS
          - version: v6.12 # 2024 LTS
          - version: v6.6  # 2023 LTS
          - version: v6.1  # 2022 LTS
          - version: v5.15 # 2021 LTS
          - version: v6.18
            fuzz: true
    runs-on: ${{ matrix.arm && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        uses: ./.github/actions/apt-deps
        with:
          packages: ${{ matrix.arm && env.PACKAGES_AARCH64 || env.PACKAGES_X86_64 }}
          install: true

      - name: Build Linux
        uses: ./.github/actions/build-linux
        with:
          version: ${{ matrix.version }}
          cov: ${{ matrix.fuzz }}

      - name: Build kSTEP
        run: make kstep KERNEL=${{ matrix.version }}

      - name: "[Run] Execute driver"
        if: ${{ ! matrix.fuzz }}
        timeout-minutes: 1
        run: ./run.py --kernel ${{ matrix.version }}

      - name: "[Run] Show driver output"
        if: ${{ ! matrix.fuzz }}
        run: cat results/latest/kstep.jsonl

      - name: "[Fuzz] Execute workers"
        if: ${{ matrix.fuzz }}
        timeout-minutes: 5
        run: |
          ./fuzz.py \
            --kernel ${{ matrix.version }} \
            --workers 1 \
            --steps 10 \
            --ci_mode

      - name: "[Fuzz] Show fresh-mode log"
        if: ${{ matrix.fuzz }}
        run: cat results/fuzz/fresh/worker.debug.log

      - name: "[Fuzz] Show replay-mode log"
        if: ${{ matrix.fuzz }}
        run: cat results/fuzz/replay/worker.debug.log

      - name: "[Fuzz] Show mutation-mode log"
        if: ${{ matrix.fuzz }}
        run: cat results/fuzz/mutation/worker.debug.log
