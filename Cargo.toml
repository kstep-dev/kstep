# kSTEP's host-side tooling. Everything that used to be Python glue around git, make, gcc and
# QEMU lives here; plotting stays in scripts/ (matplotlib) and reads what the kstep binary writes.
#
#   ./kstep.sh <checkout|build|run|reproduce|web> ...
#
# crates/core   kstep-core: what the wasm page shares with the binaries (shm decoder, QEMU argv)
# crates/kstep  the `kstep` binary and its library (checkout, build, bugs.yaml, results, sessions)
# crates/fuzz   kstep-fuzz: the LibAFL fuzzer, a client of the library; not a default member, so a
#               plain `cargo build` never compiles LibAFL (`cargo build -p kstep-fuzz` does)
[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/core", "crates/kstep"]
exclude = ["build", "website"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kstep-dev/kstep"

# Symbols in optimized binaries: the fuzzer's panics and perf profiles should name functions.
[profile.release]
debug = 1
