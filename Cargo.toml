# kSTEP's host-side tooling. Everything that used to be Python glue around git, make, gcc and
# QEMU lives here; plotting stays in scripts/ (matplotlib) and reads what the kstep binary writes.
#
#   ./kstep.sh <checkout|build|run|reproduce|web> ...
#
# crates/core   kstep-core: what every client shares, wasm included (shm decoder, QEMU argv)
# crates/host   kstep-host: kernel checkout and build, bugs.yaml, results dirs (host tooling only)
# crates/cli    kstep-cli: the `kstep` binary
# crates/fuzz   kstep-fuzz: the LibAFL fuzzer (moves here from fuzzer/ in a later step)
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzzer", "build", "website"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kstep-dev/kstep"

# Symbols in optimized binaries: the fuzzer's panics and perf profiles should name functions.
[profile.release]
debug = 1
