[package]
name = "kstep-cli"
description = "kSTEP command line: check out and build kernels, run drivers, reproduce bugs, build the website"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kstep-cli"
path = "src/main.rs"

[dependencies]
kstep-core = { path = "../core" }
kstep-host = { path = "../host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
