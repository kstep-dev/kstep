[package]
name = "kstep-core"
description = "kSTEP's shared library: shared-memory decoder and QEMU command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[features]
default = ["host"]
# Everything but the shm decoder: the wasm build turns this off
host = []
